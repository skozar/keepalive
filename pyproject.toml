[project]
name = "keepalive-cli"
description = "Keep macOS active for messaging apps"
license = { text = "PolyForm Noncommercial 1.0.0" }
requires-python = ">=3.14,<3.16"
dynamic = ["version"]
dependencies = [
    "click>=8.1",
    "pyobjc-framework-Quartz>=12.0; sys_platform == \"darwin\"",
    "questionary>=2.1.1",
]


[tool.pdm]
version = { source = "file", path = "src/keepalive/__init__.py" }

[project.scripts]
keepalive = "keepalive.cli:cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pyinstaller>=6.0; sys_platform == \"darwin\"",
    "ruff>=0.16.0",
    "codespell>=2.4.3",
    "pre-commit>=4.6.1",
    "mypy>=2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C90"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["keepalive"]

[tool.ruff.format]
quote-style = "double"
exclude = ["*.md"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["Quartz", "pyobjc_framework_Quartz"]
ignore_missing_imports = true

[tool.codespell]
skip = "*.lock,dist,*.spec,.venv,*.icns,*.png,build"
ignore-words-list = "crate,caf"

[tool.pytest.ini_options]
testpaths = ["tests"]
